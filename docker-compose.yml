services:


  app:
    image: ${APP_IMAGE:-schoolpro-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/${POSTGRES_DB:-saasmasterpro}?pgbouncer=true&connection_limit=15
      - REDIS_URL=redis://redis:6379
      - DISABLE_WORKER=true
    volumes:
      - uploads:/app/uploads
      - ./backups:/app/backups
      - /etc/dokploy/traefik/dynamic:/app/traefik-dynamic:rw
    depends_on:
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      default:
      shared-proxy:
        aliases:
          - ${APP_ALIAS:-schoolpro-dev-app}

  worker:
    image: ${APP_IMAGE:-schoolpro-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/${POSTGRES_DB:-saasmasterpro}?pgbouncer=true&connection_limit=5
      - REDIS_URL=redis://redis:6379
    volumes:
      - /etc/dokploy/traefik/dynamic:/app/traefik-dynamic:rw
    command: npm run worker
    depends_on:
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      default:

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-saasmasterpro}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      ADMIN_USERS: ${POSTGRES_USER:-postgres}
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 5432
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6434}:5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saasmasterpro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - default

