services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/schoolpro.id.conf:/etc/nginx/conf.d/schoolpro.id.conf:ro
      - ./nginx/schoolpro.my.id.conf:/etc/nginx/conf.d/schoolpro.my.id.conf:ro
      - ./nginx/analytics.schoolpro.my.id.conf:/etc/nginx/conf.d/analytics.schoolpro.my.id.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

  app:
    image: ${APP_IMAGE:-schoolpro-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-saasmasterpro}?pgbouncer=true
      - DISABLE_WORKER=true
    volumes:
      - uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      default:
      shared-proxy:
        aliases:
          - ${APP_ALIAS:-schoolpro-app}

  worker:
    image: ${APP_IMAGE:-schoolpro-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-saasmasterpro}?pgbouncer=true
    command: npm run worker
    depends_on:
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      default:

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-saasmasterpro}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      ADMIN_USERS: ${POSTGRES_USER:-postgres}
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  db:
    profiles:
      - prod
      - db
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saasmasterpro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

  redis:
    profiles:
      - prod
      - redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

