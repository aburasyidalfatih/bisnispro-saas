services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/schoolpro.id.conf:/etc/nginx/conf.d/schoolpro.id.conf:ro
      - ./nginx/schoolpro.my.id.conf:/etc/nginx/conf.d/schoolpro.my.id.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

  app:
    image: ${APP_IMAGE:-schoolpro-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-http://wa-gateway:4000}
    volumes:
      - uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    networks:
      default:
      shared-proxy:
        aliases:
          - ${APP_ALIAS:-schoolpro-app}

  db:
    profiles:
      - prod
      - db
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saasmasterpro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

  redis:
    profiles:
      - prod
      - redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

  wa-gateway:
    profiles:
      - prod
    build:
      context: .
      dockerfile: services/wa-gateway/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WA_GATEWAY_PORT=4000
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  uploads:
  redisdata:

networks:
  shared-proxy:
    external: true
