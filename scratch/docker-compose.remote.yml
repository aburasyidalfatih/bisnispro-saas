services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/schoolpro.id.conf:/etc/nginx/conf.d/schoolpro.id.conf:ro
      - ./nginx/schoolpro.my.id.conf:/etc/nginx/conf.d/schoolpro.my.id.conf:ro
      - ./nginx/analytics.schoolpro.my.id.conf:/etc/nginx/conf.d/analytics.schoolpro.my.id.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

  app:
    image: ${APP_IMAGE:-schoolpro-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-http://wa-gateway:4000}
    volumes:
      - uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    networks:
      default:
      shared-proxy:
        aliases:
          - ${APP_ALIAS:-schoolpro-app}

  db:
    profiles:
      - prod
      - db
    image: postgres:16-alpine
    command: postgres -c shared_buffers=512MB -c work_mem=16MB -c max_connections=200
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saasmasterpro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

  redis:
    profiles:
      - prod
      - redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

#  wa-gateway:
#    profiles:
#      - prod
#    build:
#      context: .
#      dockerfile: services/wa-gateway/Dockerfile
#    env_file:
#      - .env
#    environment:
#      - DATABASE_URL=${DATABASE_URL}
#      - WA_GATEWAY_PORT=4000
#    depends_on:
#      db:
#        condition: service_healthy
#        required: false
#    restart: unless-stopped
#    networks:
#      - default

  umami-db:
    profiles:
      - prod
      - umami
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_secure_password}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  umami:
    profiles:
      - prod
      - umami
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami_secure_password}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-replace_this_with_random_string}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - shared-proxy

volumes:
  pgdata:
  uploads:
  redisdata:
  umami-db-data:

networks:
  shared-proxy:
    external: true
