name: Deploy SchoolPro SaaS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set target branch name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
            if [ "${{ github.event.inputs.branch }}" = "main" ]; then
              echo "ROOT_DOMAIN=schoolpro.id" >> $GITHUB_ENV
            else
              echo "ROOT_DOMAIN=schoolpro.my.id" >> $GITHUB_ENV
            fi
          else
            echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "ROOT_DOMAIN=schoolpro.id" >> $GITHUB_ENV
            else
              echo "ROOT_DOMAIN=schoolpro.my.id" >> $GITHUB_ENV
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Set lowercase repository name
        run: |
          REPO="${{ github.repository }}"
          echo "REPO=${REPO,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space and set up swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ env.BRANCH }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ env.ROOT_DOMAIN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set target variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
          else
            echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
          REPO="${{ github.repository }}"
          echo "REPO=${REPO,,}" >> $GITHUB_ENV

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          BRANCH: ${{ env.BRANCH }}
          REPO: ${{ env.REPO }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,ACTOR,CRON_SECRET,SENTRY_DSN,BRANCH,REPO,REMOTE_USER
          script: |
            set -e
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            if [ "$BRANCH" = "main" ]; then
              APP_DIR="/opt/schoolpro-prod"
            else
              APP_DIR="/opt/schoolpro-dev"
            fi
            echo "Deploying branch $BRANCH to $APP_DIR"
            cd "$APP_DIR"

            if [ -n "$CRON_SECRET" ]; then
              if ! grep -q "^CRON_SECRET=" .env; then
                echo -e "\nCRON_SECRET=\"$CRON_SECRET\"" >> .env
              else
                sed -i "s|^CRON_SECRET=.*|CRON_SECRET=\"$CRON_SECRET\"|g" .env
              fi
            fi

            if [ -n "$SENTRY_DSN" ]; then
              if ! grep -q "^NEXT_PUBLIC_SENTRY_DSN=" .env; then
                echo -e "\nNEXT_PUBLIC_SENTRY_DSN=\"$SENTRY_DSN\"" >> .env
              else
                sed -i "s|^NEXT_PUBLIC_SENTRY_DSN=.*|NEXT_PUBLIC_SENTRY_DSN=\"$SENTRY_DSN\"|g" .env
              fi
            fi

            docker compose pull app worker
            docker compose up -d --no-build --remove-orphans
            
            echo "Waiting for container to be ready..."
            sleep 10
            
            echo "Running database synchronization..."
            if [ "$BRANCH" = "main" ]; then
              export DATABASE_URL="postgresql://${POSTGRES_USER:-db_admin_schoolpro}:${POSTGRES_PASSWORD:-}@127.0.0.1:5432/${POSTGRES_DB:-saasmasterpro}"
            else
              export DATABASE_URL="postgresql://${POSTGRES_USER:-db_admin_dev}:${POSTGRES_PASSWORD:-}@127.0.0.1:5433/${POSTGRES_DB:-schoolpro_dev_db}"
            fi
            source .env
            npx -y prisma@6.19.3 db push --accept-data-loss --skip-generate 2>&1 || echo "⚠️ Synchronization failed!"
            
            echo "Running health check..."
            HEALTH_OK=false
            for i in $(seq 1 12); do
              RESULT=$(docker exec ${APP_DIR##*/}-app-1 node -e "fetch('http://localhost:3000/api/health').then(r=>r.text()).then(console.log)" 2>/dev/null || echo "fail")
              if echo "$RESULT" | grep -q "healthy"; then
                echo "✅ Health check passed!"
                HEALTH_OK=true
                break
              fi
              echo "Attempt $i/12 — waiting 5s..."
              sleep 5
            done
            
            if [ "$HEALTH_OK" = "false" ]; then
              echo "⚠️ Health check did not pass, but container is running."
            fi
            
            docker logout ghcr.io
            docker image prune -f
            echo "✅ Deployment completed!"
