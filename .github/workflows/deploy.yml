name: Deploy SchoolPro SaaS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set target branch name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
            if [ "${{ github.event.inputs.branch }}" = "main" ]; then
              echo "ROOT_DOMAIN=schoolpro.id" >> $GITHUB_ENV
            else
              echo "ROOT_DOMAIN=schoolpro.my.id" >> $GITHUB_ENV
            fi
          else
            echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "ROOT_DOMAIN=schoolpro.id" >> $GITHUB_ENV
            else
              echo "ROOT_DOMAIN=schoolpro.my.id" >> $GITHUB_ENV
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Set lowercase repository name
        run: |
          REPO="${{ github.repository }}"
          echo "REPO=${REPO,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ env.BRANCH }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ env.ROOT_DOMAIN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set target variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
          else
            echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
          REPO="${{ github.repository }}"
          echo "REPO=${REPO,,}" >> $GITHUB_ENV

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          BRANCH: ${{ env.BRANCH }}
          REPO: ${{ env.REPO }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,ACTOR,CRON_SECRET,SENTRY_DSN,BRANCH,REPO,REMOTE_USER
          script: |
            set -e
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            if [ "$BRANCH" = "main" ]; then
              APP_DIR="/home/$REMOTE_USER/schoolpro-prod"
            else
              APP_DIR="/home/$REMOTE_USER/schoolpro-dev"
            fi
            echo "Deploying branch $BRANCH to $APP_DIR"
            cd "$APP_DIR"

            if [ -n "$CRON_SECRET" ]; then
              if ! grep -q "^CRON_SECRET=" .env; then
                echo -e "\nCRON_SECRET=\"$CRON_SECRET\"" >> .env
              else
                sed -i "s|^CRON_SECRET=.*|CRON_SECRET=\"$CRON_SECRET\"|g" .env
              fi
            fi

            if [ -n "$SENTRY_DSN" ]; then
              if ! grep -q "^NEXT_PUBLIC_SENTRY_DSN=" .env; then
                echo -e "\nNEXT_PUBLIC_SENTRY_DSN=\"$SENTRY_DSN\"" >> .env
              else
                sed -i "s|^NEXT_PUBLIC_SENTRY_DSN=.*|NEXT_PUBLIC_SENTRY_DSN=\"$SENTRY_DSN\"|g" .env
              fi
            fi

            git remote set-url origin https://oauth2:$GITHUB_TOKEN@github.com/$REPO.git
            git fetch --all
            git reset --hard origin/$BRANCH
            
            docker network ls | grep -q "shared-proxy" || docker network create shared-proxy
            
            export APP_IMAGE="ghcr.io/$REPO:$BRANCH"
            if [ "$BRANCH" = "main" ]; then
              export APP_ALIAS="schoolpro-prod-app"
            else
              export APP_ALIAS="schoolpro-dev-app"
            fi
            
            docker compose pull app
            
            if [ "$BRANCH" = "main" ]; then
              docker compose up -d --no-build app worker db redis --remove-orphans
            else
              docker compose up -d --no-build app worker --remove-orphans
            fi
            
            echo "Waiting for container to be ready..."
            sleep 10
            
            echo "Running database synchronization..."
            docker compose exec -T app node node_modules/prisma/build/index.js db push --accept-data-loss --skip-generate 2>&1 || echo "⚠️ Synchronization failed!"
            
            if [ "$BRANCH" = "main" ]; then
              echo "Restarting Nginx proxy to flush DNS cache..."
              docker compose restart nginx
            fi
            
            echo "Running health check..."
            HEALTH_OK=false
            for i in $(seq 1 12); do
              RESULT=$(docker compose exec -T app wget -qO- http://localhost:3000/api/health 2>/dev/null || echo "fail")
              if echo "$RESULT" | grep -q "healthy"; then
                echo "✅ Health check passed!"
                HEALTH_OK=true
                break
              fi
              echo "Attempt $i/12 — waiting 5s..."
              sleep 5
            done
            
            if [ "$HEALTH_OK" = "false" ]; then
              echo "⚠️ Health check did not pass, but container is running."
            fi
            
            docker logout ghcr.io
            docker image prune -f
            echo "✅ Deployment completed!"
