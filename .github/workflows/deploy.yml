name: Deploy SchoolPro SaaS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set target branch name
        id: vars
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Add-Content -Path $env:GITHUB_ENV -Value "BRANCH=${{ github.event.inputs.branch }}"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "BRANCH=${{ github.ref_name }}"
          }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Set lowercase repository name
        run: |
          $repo = "${{ github.repository }}".ToLower()
          Add-Content -Path $env:GITHUB_ENV -Value "REPO=$repo"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ghcr.io/${{ env.REPO }}:${{ env.BRANCH }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Set target variables
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Add-Content -Path $env:GITHUB_ENV -Value "BRANCH=${{ github.event.inputs.branch }}"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "BRANCH=${{ github.ref_name }}"
          }
          $repo = "${{ github.repository }}".ToLower()
          Add-Content -Path $env:GITHUB_ENV -Value "REPO=$repo"

      - name: Execute Deployment via Native SSH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # 1. Setup SSH Key with correct permissions
          $sshDir = "$env:USERPROFILE\.ssh"
          if (-not (Test-Path -Path $sshDir)) { New-Item -ItemType Directory -Path $sshDir -Force | Out-Null }
          $keyPath = "$sshDir\deploy_key"
          Set-Content -Path $keyPath -Value $env:SSH_PRIVATE_KEY
          icacls $keyPath /inheritance:r /grant "$($env:USERNAME):F" | Out-Null
          
          # 2. Build the bash script to execute on the VPS
          $script = @"
          set -e
          echo `"$env:GITHUB_TOKEN`" | docker login ghcr.io -u $env:ACTOR --password-stdin
          if [ `"$env:BRANCH`" = `"main`" ]; then
            APP_DIR=`"/home/$env:REMOTE_USER/schoolpro-prod`"
          else
            APP_DIR=`"/home/$env:REMOTE_USER/schoolpro-dev`"
          fi
          echo `"Deploying branch $env:BRANCH to `$APP_DIR`"
          cd `$APP_DIR

          if [ -n `"$env:CRON_SECRET`" ]; then
            if ! grep -q `"^CRON_SECRET=`" .env; then
              echo -e `"\nCRON_SECRET=\`"$env:CRON_SECRET\`"`" >> .env
            else
              sed -i `"s|^CRON_SECRET=.*|CRON_SECRET=\`"$env:CRON_SECRET\`"|g`" .env
            fi
          fi

          git remote set-url origin https://oauth2:$env:GITHUB_TOKEN@github.com/$env:REPO.git
          git fetch --all
          git reset --hard origin/$env:BRANCH
          
          docker network ls | grep -q `"shared-proxy`" || docker network create shared-proxy
          
          export APP_IMAGE=`"ghcr.io/$env:REPO:$env:BRANCH`"
          if [ `"$env:BRANCH`" = `"main`" ]; then
            export APP_ALIAS=`"schoolpro-prod-app`"
          else
            export APP_ALIAS=`"schoolpro-dev-app`"
          fi
          
          docker compose pull app
          
          if [ `"$env:BRANCH`" = `"main`" ]; then
            docker compose up -d --no-build app db redis wa-gateway --remove-orphans
          else
            docker compose up -d --no-build app --remove-orphans
          fi
          
          echo `"Waiting for container to be ready...`"
          sleep 10
          
          echo `"Running database synchronization...`"
          docker compose exec -T app node node_modules/prisma/build/index.js db push --accept-data-loss --skip-generate 2>&1 || echo `"⚠️ Synchronization failed!`"
          
          if [ `"$env:BRANCH`" = `"main`" ]; then
            echo `"Restarting Nginx proxy to flush DNS cache...`"
            docker compose restart nginx
          fi
          
          echo `"Running health check...`"
          HEALTH_OK=false
          for i in `$(seq 1 12); do
            RESULT=`$(docker compose exec -T app wget -qO- http://localhost:3000/api/health 2>/dev/null || echo `"fail`")
            if echo `"$RESULT`" | grep -q `"healthy`"; then
              echo `"✅ Health check passed!`"
              HEALTH_OK=true
              break
            fi
            echo `"Attempt `$i/12 — waiting 5s...`"
            sleep 5
          done
          
          if [ `"$HEALTH_OK`" = `"false`" ]; then
            echo `"⚠️ Health check did not pass, but container is running.`"
          fi
          
          docker logout ghcr.io
          docker image prune -f
          echo `"✅ Deployment completed!`"
          "@
          
          # Force LF line endings for bash compatibility
          $script = $script.Replace("`r`n", "`n")
          [IO.File]::WriteAllText("deploy_script.sh", $script)
          
          # 3. Execute script over SSH natively
          cmd.exe /c "ssh -o StrictHostKeyChecking=no -i $keyPath ""$env:REMOTE_USER@$env:REMOTE_HOST"" ""bash -s"" < deploy_script.sh"
          
          # Clean up key
          Remove-Item -Path $keyPath -Force
